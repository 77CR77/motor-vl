name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Залить по SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set sftp:auto-confirm yes;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=2 \
              --no-perms \
              --ignore-time \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vscode/ \
              --exclude-glob .claude/ \
              --exclude-glob tools/ \
              --exclude-glob .DS_Store \
              --exclude-glob README.md \
              --exclude-glob DEPLOY.md \
              --exclude-glob '*.mp4' \
              --exclude-glob 'api/config.local.php' \
              --exclude-glob 'private/*' \
              --exclude-glob 'data/motors.json' \
              --exclude-glob 'media/motors/*' \
              ./ \"$REMOTE_DIR\"
          "
