name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Показать, куда подключились
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            echo '--- домашний каталог при входе ---';
            pwd;
            ls;
            echo '--- пробуем зайти в $REMOTE_DIR ---';
            cd \"$REMOTE_DIR\" && pwd && ls;
          " || echo "не удалось зайти в $REMOTE_DIR — смотрите список выше"

      - name: Залить по SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$USER_NAME\",\"$PASSWORD\" sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vscode/ \
              --exclude-glob .claude/ \
              --exclude-glob tools/ \
              --exclude-glob .DS_Store \
              --exclude-glob README.md \
              --exclude-glob DEPLOY.md \
              --exclude-glob '*.mp4' \
              --exclude-glob 'api/config.local.php' \
              --exclude-glob 'private/*' \
              ./ \"$REMOTE_DIR\"
          "
