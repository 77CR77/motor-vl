name: Deploy website to REG.RU

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p deploy

          rsync -av ./ deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.claude/' \
            --exclude='tools/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='DEPLOY.md' \
            --exclude='admin/preview.html' \
            --exclude='api/config.local.php' \
            --exclude='media/*/video/'

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.FTP_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to REG.RU
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e rsync -az \
            --no-owner \
            --no-group \
            deploy/ \
            "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_HOST }}:/var/www/u0942876/data/www/motor-vl.ru/"
