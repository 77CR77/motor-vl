name: Снимок каталога

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Скачать каталог с сайта
        run: |
          curl -sSL --max-time 60 https://motor-vl.ru/data/motors.json -o /tmp/motors.json
          curl -sSL --max-time 60 https://motor-vl.ru/data/brands.json -o /tmp/brands.json
          python3 -c "import json; json.load(open('/tmp/motors.json'))"
          python3 -c "import json; json.load(open('/tmp/brands.json'))"
          python3 - <<'PY'
          import json
          for src, dst in (("/tmp/motors.json", "data/motors.json"),
                           ("/tmp/brands.json", "data/brands.json")):
              data = json.load(open(src, encoding="utf-8"))
              with open(dst, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")
          PY

      - name: Закоммитить, если каталог изменился
        run: |
          if git diff --quiet -- data/motors.json data/brands.json; then
            echo "Каталог не менялся — коммит не нужен"
            exit 0
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('data/motors.json'))))")
          git config user.name "Anton"
          git config user.email "antonsheludko37@gmail.com"
          git add data/motors.json data/brands.json
          git commit -m "Снимок каталога: $COUNT позиций"
          git push
